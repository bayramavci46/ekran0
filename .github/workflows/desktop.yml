# Builds the desktop app (desktop/) for Windows and macOS, starts each build once to check that
# it really works (desktop/scripts/smoke.mjs), and for tags like v1.0.0 publishes the installers
# as a GitHub release. The website links to releases/latest/download/<file name>.
name: Masaüstü uygulaması

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            file: Kurgu-Masasi-Windows.exe
          - name: macOS
            os: macos-latest
            target: --mac
            file: Kurgu-Masasi-Mac.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      # electron-builder downloads the Electron builds it packages; the dev binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build the installer
        run: npm run dist -- ${{ matrix.target }}
      - name: Start the packaged app and check it
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: desktop/dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Ekran kaydı ile kamera kaydını tek videoda birleştiren Kurgu Masası, masaüstü uygulaması olarak.
          Videolarınız bilgisayarınızdan çıkmaz; uygulama internet olmadan da çalışır.

          **İndir**
          - Windows 10 ve 11 (64 bit): `Kurgu-Masasi-Windows.exe`
          - macOS 12 ve sonrası, Apple Silicon ve Intel: `Kurgu-Masasi-Mac.dmg`

          **İlk açılış**
          Uygulama henüz bir geliştirici sertifikasıyla imzalanmadığı için sistem ilk açılışta uyarır:
          - Windows: "Windows kişisel bilgisayarınızı korudu" penceresinde **Ek bilgi**, sonra **Yine de çalıştır**.
          - Mac: Uygulamayı Uygulamalar klasörüne sürükleyip açın. "Açılmadı" uyarısı çıkarsa **Sistem Ayarları → Gizlilik ve Güvenlik** bölümünde **Yine de Aç** düğmesine basın.
          NOTES
          gh release create "$TAG" out/Kurgu-Masasi-Windows.exe out/Kurgu-Masasi-Mac.dmg \
            --repo "$GITHUB_REPOSITORY" --title "Kurgu Masası ${TAG#v}" --notes-file notes.md
