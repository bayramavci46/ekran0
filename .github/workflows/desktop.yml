# Builds the desktop app (desktop/) for Windows and macOS, starts each build once to check that
# it really works (desktop/scripts/smoke.mjs), and publishes the installers as a GitHub release:
# for a pushed tag like v1.0.0, or when run by hand with a version. The release text comes from
# desktop/release-notes.md. The website links to releases/latest/download/<file name>.
name: Masaüstü uygulaması

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Yayımlanacak sürüm, ör. 1.0.0 (desktop/package.json ile aynı). Boş bırakılırsa yalnızca derlenip denenir.
        required: false
        default: ''

permissions:
  contents: write

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            file: Kurgu-Masasi-Windows.exe
          - name: macOS
            os: macos-latest
            target: --mac
            file: Kurgu-Masasi-Mac.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      # electron-builder downloads the Electron builds it packages; the dev binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check that the release matches the app version
        if: env.RELEASE != ''
        run: node -e "const v = require('./package.json').version; if (v !== process.env.RELEASE.replace(/^v/, '')) { console.error('desktop/package.json has ' + v + ', the release is ' + process.env.RELEASE); process.exit(1); }"
      - run: npm ci
      - name: Build the installer
        run: npm run dist -- ${{ matrix.target }}
      - name: Start the packaged app and check it
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: desktop/dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: desktop/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${RELEASE#v}"
          # Creates the tag on the built commit when it does not exist yet.
          gh release create "$TAG" out/Kurgu-Masasi-Windows.exe out/Kurgu-Masasi-Mac.dmg \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kurgu Masası ${TAG#v}" \
            --notes-file desktop/release-notes.md
